{# A requirement in a `walk` block: its text, where it's specified, and the code that
   names it. Whether that's enough is tracey's to say; this is for finding the code. #}
<figure class="walk reqfig" data-ref="{{ ref.key }}" data-md="{{ ref.line }}" id="req-{{ slug }}">
<figcaption>
  <div class="cap-main">
    <span class="kind k-req">req</span>
    <a class="path" href="#" data-req="{{ req.id }}" title="Hover for its text">{{ req.id }}</a>
    <span class="acts">
      <a class="act" href="/spec/{{ req.file }}?req={{ req.id }}" title="Read it in its spec">Spec</a>
      <button class="act" data-action="copy" title="Copy the reference">Copy</button>
    </span>
  </div>
  <div class="cap-sub">
    <a class="loc" href="/spec/{{ req.file }}?req={{ req.id }}">{{ req.file }}:{{ req.line }}</a>
    <span class="spacer"></span>
    {% set impls = traces | selectattr("kind", "equalto", "impl") | list %}
    {% set verifies = traces | selectattr("kind", "equalto", "verify") | list %}
    <span class="trace-count">{{ impls | length }} impl · {{ verifies | length }} verify</span>
  </div>
</figcaption>
<div class="req-text">{{ text }}</div>
{% if traces %}
<div class="req-traces">
  {% for t in traces %}
  <a class="trace t-{{ t.kind }}" href="#" data-file="{{ t.file }}" data-start="{{ t.start }}" data-end="{{ t.end }}" data-line="{{ t.line }}"
     title="{{ t.file }}:{{ t.line }}"><span class="tk">{{ t.kind }}</span>{{ t.name }}</a>
  {% endfor %}
</div>
{% endif %}
</figure>
